<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgoQuest — Petualangan Algoritma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E1F;
  --bg2:#12163045;
  --panel:#141935;
  --panel-hi:#1B2148;
  --line:#2A2F58;
  --primary:#7C5CFC;
  --primary-dim:#4E3AA8;
  --cyan:#00E5C7;
  --pink:#FF5C93;
  --amber:#FFC24B;
  --text:#F2F4FF;
  --text-dim:#A6ACD6;
  --text-faint:#6C72A0;
  --success:#35D488;
  --danger:#FF5C5C;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:24px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at 15% 10%, #1B2050 0%, transparent 45%),
    radial-gradient(circle at 85% 0%, #2A1642 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, #0E1435 0%, transparent 50%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
#app{width:100%; min-height:100vh; display:flex;}

/* ---------- circuit background ---------- */
.circuit-bg{position:fixed; inset:0; z-index:0; opacity:.35; pointer-events:none;}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:260px; flex-shrink:0; background:linear-gradient(180deg,#10142C,#0C0F22);
  border-right:1px solid var(--line); padding:22px 16px; display:flex; flex-direction:column;
  gap:22px; position:sticky; top:0; height:100vh; z-index:5;
}
#sidebar.hidden{display:none;}
.brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:conic-gradient(from 220deg, var(--cyan), var(--primary), var(--pink), var(--cyan)); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:15px; color:#0B0E1F; flex-shrink:0;}
.brand-name{font-family:'Space Grotesk'; font-weight:700; font-size:16px; line-height:1.1;}
.brand-sub{font-size:11px; color:var(--text-faint);}
.student-chip{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-s); padding:10px 12px; font-size:12.5px; color:var(--text-dim); line-height:1.6;}
.student-chip b{color:var(--text); font-weight:600;}

nav#steps{display:flex; flex-direction:column; gap:4px; flex:1; overflow-y:auto;}
.step-btn{
  display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:var(--radius-s);
  background:transparent; border:1px solid transparent; cursor:pointer; text-align:left; color:var(--text-dim);
  font-size:13.5px; font-weight:500; transition:background .15s, border-color .15s, color .15s;
}
.step-btn .node{width:22px; height:22px; border-radius:7px; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; font-family:'JetBrains Mono'; flex-shrink:0; color:var(--text-faint);}
.step-btn:hover:not(.locked){background:var(--panel); color:var(--text);}
.step-btn.active{background:linear-gradient(90deg, #1E2452, #171B3E); border-color:var(--primary); color:var(--text);}
.step-btn.active .node{background:var(--primary); border-color:var(--primary); color:#fff;}
.step-btn.done .node{background:var(--success); border-color:var(--success); color:#06301E;}
.step-btn.locked{opacity:.4; cursor:not-allowed;}
.rail{width:1px; background:var(--line); height:10px; margin-left:21px;}

.sidebar-foot{font-size:10.5px; color:var(--text-faint); padding:0 4px; line-height:1.6;}
.teacher-link{
  background:transparent; border:1px dashed var(--line); color:var(--text-faint); font-size:12px; font-family:'Inter';
  padding:9px 10px; border-radius:var(--radius-s); cursor:pointer; text-align:left; transition:border-color .15s, color .15s;
}
.teacher-link:hover{border-color:var(--amber); color:var(--amber);}

/* ---------- MAIN ---------- */
#main{flex:1; min-width:0; position:relative; z-index:1; display:flex; flex-direction:column;}
#topbar{display:none; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); background:#0C0F22CC; backdrop-filter:blur(8px); position:sticky; top:0; z-index:10;}
#stage{flex:1; padding:36px 44px 80px; max-width:980px; width:100%; margin:0 auto;}
.eyebrow-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:4px 10px; border-radius:999px; background:var(--panel); border:1px solid var(--line); color:var(--text-dim);}
.pill.cyan{border-color:#00E5C74d; color:var(--cyan);}
.pill.pink{border-color:#FF5C934d; color:var(--pink);}
.pill.amber{border-color:#FFC24B4d; color:var(--amber);}
.page-title{font-size:32px; margin-bottom:8px;}
.page-desc{color:var(--text-dim); font-size:15px; max-width:640px; margin-bottom:30px; line-height:1.6;}

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m); padding:24px;}
.card + .card{margin-top:16px;}
.btn{
  font-family:'Inter'; font-weight:600; font-size:14px; padding:12px 22px; border-radius:var(--radius-s);
  border:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:transform .12s, box-shadow .12s, opacity .12s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg, var(--primary), #5B3FE0); color:#fff; box-shadow:0 8px 24px -8px #7C5CFC80;}
.btn-primary:hover{box-shadow:0 10px 28px -6px #7C5CFCa0;}
.btn-ghost{background:var(--panel-hi); color:var(--text); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--primary);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-row{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap;}

label.field-label{display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:7px;}
input[type=text], input[type=date], select{
  width:100%; background:#0D1130; border:1px solid var(--line); border-radius:var(--radius-s); padding:12px 14px;
  color:var(--text); font-family:'Inter'; font-size:14.5px; outline:none; transition:border-color .15s;
}
input[type=text]:focus, input[type=date]:focus, select:focus{border-color:var(--primary);}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:720px){.grid-2{grid-template-columns:1fr;}}

::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}

@media (max-width:880px){
  #sidebar{position:fixed; left:-280px; transition:left .2s; box-shadow:0 0 40px #000a;}
  #sidebar.open{left:0;}
  #topbar{display:flex;}
  #stage{padding:26px 18px 70px;}
  .page-title{font-size:26px;}
}

/* ---------- QUIZ / QUESTION CARDS ---------- */
.qcard{margin-bottom:14px;}
.qnum{font-family:'JetBrains Mono'; font-size:11px; color:var(--text-faint); margin-bottom:8px; letter-spacing:.02em;}
.qtext{font-size:15.5px; font-weight:500; margin-bottom:16px; line-height:1.55;}
.opts{display:flex; flex-direction:column; gap:8px;}
.optbtn{
  display:flex; align-items:center; gap:12px; text-align:left; padding:12px 14px; border-radius:var(--radius-s);
  background:#0D1130; border:1px solid var(--line); color:var(--text-dim); cursor:pointer; font-size:14px; font-family:'Inter';
  transition:border-color .15s, background .15s, color .15s;
}
.optbtn:hover{border-color:var(--primary-dim); color:var(--text);}
.optbtn.picked{border-color:var(--primary); background:#1A1F49; color:var(--text);}
.optletter{
  flex-shrink:0; width:26px; height:26px; border-radius:7px; background:var(--panel-hi); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-size:12px; font-weight:600; color:var(--text-faint);
}
.optbtn.picked .optletter{background:var(--primary); border-color:var(--primary); color:#fff;}

/* ---------- MATERI CARDS ---------- */
.materi-card{border-left:3px solid var(--line); position:relative;}
.mc-cyan{border-left-color:var(--cyan);}
.mc-pink{border-left-color:var(--pink);}
.materi-points{list-style:none; display:flex; flex-direction:column; gap:9px; margin-bottom:16px;}
.materi-points li{position:relative; padding-left:18px; font-size:14px; color:var(--text-dim); line-height:1.6;}
.materi-points li::before{content:''; position:absolute; left:0; top:8px; width:6px; height:6px; border-radius:2px; background:var(--primary); transform:rotate(45deg);}
.pseudocode-box{background:#0A0D22; border:1px solid var(--line); border-radius:var(--radius-s); padding:16px 18px; font-size:12.5px; color:var(--cyan); white-space:pre; overflow-x:auto; line-height:1.7;}

/* ---------- SIMULATOR ---------- */
.sim-bars{display:flex; align-items:flex-end; gap:6px; height:190px; padding:10px 4px 0; overflow-x:auto;}
.bar{
  flex:1; min-width:26px; background:linear-gradient(180deg, var(--primary), var(--primary-dim));
  border-radius:6px 6px 3px 3px; position:relative; display:flex; align-items:flex-start; justify-content:center;
  transition:height .25s, background .2s, opacity .2s;
}
.bar-val{font-size:10.5px; font-family:'JetBrains Mono'; color:var(--text-dim); position:absolute; top:-18px;}
.bar-compare{background:linear-gradient(180deg, var(--amber), #B8860B);}
.bar-pivot{background:linear-gradient(180deg, var(--pink), #A6386A); box-shadow:0 0 0 2px #FF5C934d;}
.bar-swap{background:linear-gradient(180deg, #FF9BC0, var(--pink));}
.bar-found{background:linear-gradient(180deg, var(--success), #1F9463); box-shadow:0 0 14px #35D48870;}
.bar-dim{opacity:.25;}
.sim-controls{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px;}
.sim-msg{margin-top:14px; font-size:13.5px; color:var(--text-dim); min-height:20px; text-align:center;}
.sim-scenario{border-left:3px solid var(--amber); background:linear-gradient(90deg, #1B1A33, var(--panel));}

/* ---------- KUIS LEVEL TABS ---------- */
.level-tabs{display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;}
.level-tab{
  padding:10px 20px; border-radius:999px; background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
  font-weight:600; font-size:13.5px; cursor:pointer; transition:border-color .15s, color .15s;
}
.level-tab.active{border-color:var(--lc, var(--primary)); color:var(--text); box-shadow:0 0 0 1px var(--lc, var(--primary)) inset;}

/* ---------- REFLEKSI ---------- */
.skala-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--line);}
.skala-row:last-of-type{border-bottom:none;}
.skala-text{font-size:14px; color:var(--text-dim); flex:1;}
.skala-opts{display:flex; gap:6px; flex-shrink:0;}
.skala-btn{width:34px; height:34px; border-radius:8px; background:#0D1130; border:1px solid var(--line); color:var(--text-dim); font-family:'JetBrains Mono'; cursor:pointer; transition:.15s;}
.skala-btn.picked{background:var(--primary); border-color:var(--primary); color:#fff;}
.skala-legend{font-size:11.5px; color:var(--text-faint); margin-top:8px;}
.reflek-textarea{
  width:100%; min-height:80px; background:#0D1130; border:1px solid var(--line); border-radius:var(--radius-s); padding:12px 14px;
  color:var(--text); font-family:'Inter'; font-size:14px; resize:vertical; outline:none;
}
.reflek-textarea:focus{border-color:var(--primary);}

/* ---------- POSTTEST ---------- */
.post-sec-title{margin:26px 0 12px; color:var(--text-dim); font-size:14px; font-weight:600;}
.match-row{display:grid; grid-template-columns:1fr 1.4fr; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
.match-row:last-child{border-bottom:none;}
.match-left{font-size:14.5px; font-weight:600;}
.match-select{background:#0D1130; border:1px solid var(--line); border-radius:var(--radius-s); padding:10px 12px; color:var(--text); font-size:13.5px;}
.isian-input{width:100%; background:#0D1130; border:1px solid var(--line); border-radius:var(--radius-s); padding:12px 14px; color:var(--text); font-size:14px; margin-top:6px; outline:none;}
.isian-input:focus{border-color:var(--primary);}

/* ---------- HASIL ---------- */
.result-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:720px){.result-grid{grid-template-columns:1fr 1fr;}}
.result-card{text-align:center;}
.result-label{font-size:12.5px; color:var(--text-faint); margin-bottom:8px;}
.result-num{font-family:'Space Grotesk'; font-size:30px; font-weight:700;}
.quizlevel-bars{display:flex; flex-direction:column; gap:12px;}
.qlbar-row{display:grid; grid-template-columns:70px 1fr 50px; align-items:center; gap:12px;}
.qlbar-label{font-size:13px; color:var(--text-dim);}
.qlbar-track{height:8px; background:#0D1130; border-radius:999px; overflow:hidden;}
.qlbar-fill{height:100%; background:linear-gradient(90deg, var(--cyan), var(--primary)); border-radius:999px;}
.qlbar-val{font-size:12px; color:var(--text-dim); text-align:right;}

/* ---------- GURU DASHBOARD ---------- */
.gate-overlay{position:fixed; inset:0; background:#05070FCC; backdrop-filter:blur(6px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.gate-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-m); padding:28px; width:100%; max-width:380px;}
.gate-card h3{font-size:18px; margin-bottom:6px;}
.gate-card p{font-size:13px; color:var(--text-dim); margin-bottom:16px; line-height:1.6;}
.gate-err{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:16px;}
.guru-table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m);}
table.guru-table{width:100%; border-collapse:collapse; font-size:13px; min-width:820px;}
table.guru-table th{text-align:left; padding:12px 14px; background:var(--panel-hi); color:var(--text-dim); font-weight:600; font-size:11.5px; text-transform:none; border-bottom:1px solid var(--line); white-space:nowrap;}
table.guru-table td{padding:12px 14px; border-bottom:1px solid var(--line); color:var(--text); white-space:nowrap;}
table.guru-table tr:last-child td{border-bottom:none;}
table.guru-table tr:hover td{background:#151A3B;}
.score-tag{display:inline-block; padding:3px 9px; border-radius:999px; font-family:'JetBrains Mono'; font-size:12px;}
.score-tag.good{background:#0F3D2A; color:var(--success);}
.score-tag.mid{background:#3D3410; color:var(--amber);}
.score-tag.low{background:#3D1414; color:var(--danger);}
.score-tag.na{background:#1B2148; color:var(--text-faint);}
.guru-toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.guru-empty{color:var(--text-dim); font-size:14px; padding:30px; text-align:center;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar" class="hidden">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <div class="brand-name">AlgoQuest</div>
        <div class="brand-sub">Informatika · Kelas X</div>
      </div>
    </div>
    <div class="student-chip" id="studentChip"></div>
    <nav id="steps"></nav>
    <div class="sidebar-foot">Klik langkah yang sudah selesai untuk meninjau ulang.</div>
    <button class="teacher-link" onclick="openGuruDashboard()">📊 Dashboard Guru</button>
  </aside>

  <main id="main">
    <div id="topbar">
      <button class="btn btn-ghost" id="menuToggle" style="padding:8px 12px;">☰ Menu</button>
      <div class="brand-name" style="font-size:14px;">AlgoQuest</div>
    </div>
    <div id="stage"></div>
  </main>
</div>


<script>
// ======================= DATA BANK =======================

const OPT5 = ['A','B','C','D','E'];

// ---------- PRE-TEST (5 PG biasa + 5 PG kompleks) ----------
const PRETEST_PG = [
  {q:"Apa yang dimaksud dengan algoritma?", opts:["Bahasa pemrograman komputer","Urutan langkah logis dan sistematis untuk menyelesaikan masalah","Sekumpulan data yang belum diolah","Program yang sudah dikompilasi","Perangkat keras pemroses data"], a:1},
  {q:"Manakah yang termasuk ciri algoritma yang baik?", opts:["Boleh berjalan tanpa henti","Langkahnya boleh ambigu","Memiliki input, proses, dan output yang jelas","Tidak perlu diuji coba","Hanya bisa diselesaikan dengan satu bahasa pemrograman"], a:2},
  {q:"Proses mencari data tertentu di dalam sekumpulan data disebut...", opts:["Sorting","Searching","Compiling","Debugging","Looping"], a:1},
  {q:"Proses menyusun data agar urut (naik/turun) disebut...", opts:["Searching","Branching","Sorting","Parsing","Hashing"], a:2},
  {q:"Notasi yang digunakan untuk menyatakan kompleksitas waktu suatu algoritma adalah...", opts:["Notasi Sigma","Notasi Big-O","Notasi Biner","Notasi Desimal","Notasi Boolean"], a:1},
];
const PRETEST_PGK = [
  {q:"Seorang siswa mencari nama temannya di daftar hadir kelas yang TIDAK diurutkan. Pendekatan apa yang paling masuk akal ia lakukan?", opts:["Melompat 5 nama sekaligus","Membagi dua daftar berulang kali","Memeriksa nama satu per satu dari awal","Mengurutkan dahulu baru menebak posisi tengah","Menghitung jumlah huruf setiap nama"], a:2},
  {q:"Jika sebuah data belum terurut, algoritma pencarian mana yang TIDAK bisa langsung digunakan secara efektif?", opts:["Pencarian Linier saja","Pencarian Biner dan Pencarian Lompat","Pencarian Linier dan Lompat","Semua algoritma pencarian bisa dipakai langsung","Tidak ada yang terpengaruh urutan data"], a:1},
  {q:"Manakah pasangan yang paling tepat menggambarkan hubungan antara ukuran data dan waktu proses pada algoritma dengan kompleksitas O(n)?", opts:["Waktu proses tetap berapa pun ukuran data","Waktu proses naik sebanding lurus dengan ukuran data","Waktu proses naik secara eksponensial","Waktu proses menurun saat data bertambah","Waktu proses hanya bergantung pada jumlah opsi jawaban"], a:1},
  {q:"Dalam strategi 'divide and conquer' (bagi dan taklukkan), langkah utama yang dilakukan adalah...", opts:["Mengulang seluruh data tanpa membaginya","Membagi masalah menjadi bagian lebih kecil, menyelesaikannya, lalu menggabungkan hasilnya","Menghapus sebagian data agar lebih cepat","Mengubah data menjadi angka biner","Menjalankan program dua kali secara paralel"], a:1},
  {q:"Ketika efisiensi menjadi prioritas utama untuk mengurutkan data dalam jumlah sangat besar, jenis algoritma yang umumnya lebih disukai dibanding algoritma pengurutan sederhana (seperti Bubble Sort) adalah...", opts:["Algoritma dengan kompleksitas O(n²) seperti Bubble Sort","Algoritma dengan kompleksitas O(n log n) seperti Merge Sort/Quick Sort","Algoritma yang tidak memiliki kompleksitas tertentu","Algoritma yang hanya bekerja pada 5 data saja","Algoritma acak tanpa pola tertentu"], a:1},
];

// ---------- MATERI ----------
const MATERI = [
  {
    id:'linier', kategori:'Pencarian', warna:'cyan', judul:'Pencarian Linier (Linear Search)',
    ringkas:"Menelusuri data satu per satu dari awal hingga ditemukan atau data habis.",
    poin:[
      "Cara kerja: bandingkan elemen pertama dengan target; jika belum cocok, lanjut ke elemen berikutnya, hingga ditemukan atau seluruh data selesai diperiksa.",
      "Tidak memerlukan data terurut — bisa dipakai di data acak.",
      "Kompleksitas waktu: O(n) pada kasus terburuk (elemen ada di akhir atau tidak ada sama sekali).",
      "Cocok untuk data berukuran kecil atau saat data belum/tidak bisa diurutkan.",
    ],
    pseudocode:`untuk i dari 0 sampai n-1:
    jika data[i] == target:
        kembalikan i  // ditemukan
kembalikan -1  // tidak ditemukan`,
  },
  {
    id:'biner', kategori:'Pencarian', warna:'cyan', judul:'Pencarian Biner (Binary Search)',
    ringkas:"Membagi dua area pencarian secara berulang pada data yang sudah terurut.",
    poin:[
      "Syarat wajib: data harus sudah terurut (naik atau turun).",
      "Cara kerja: bandingkan target dengan elemen tengah; jika target lebih kecil, cari di bagian kiri, jika lebih besar cari di bagian kanan, ulangi hingga ditemukan.",
      "Kompleksitas waktu: O(log n) — sangat efisien untuk data besar.",
      "Contoh nyata: mencari kata di kamus, mencari nomor halaman pada buku tebal.",
    ],
    pseudocode:`kiri = 0, kanan = n-1
selama kiri <= kanan:
    tengah = (kiri + kanan) / 2
    jika data[tengah] == target: kembalikan tengah
    jika data[tengah] < target: kiri = tengah + 1
    selain itu: kanan = tengah - 1
kembalikan -1`,
  },
  {
    id:'lompat', kategori:'Pencarian', warna:'cyan', judul:'Pencarian Lompat (Jump Search)',
    ringkas:"Melompat sejauh langkah tertentu (biasanya √n), lalu mencari linier di blok yang mungkin memuat target.",
    poin:[
      "Syarat: data harus sudah terurut.",

function go(stepId, {force=false}={}){
  const idx = STEPS.findIndex(s=>s.id===stepId);
  if(idx > state.unlocked && !force) return;
  state.stepIndex = idx;
  renderSidebar();
  renderStage();
  window.scrollTo({top:0, behavior:'smooth'});
}
function unlockNext(){
  state.unlocked = Math.max(state.unlocked, state.stepIndex+1);
}

// ======================= SIDEBAR =======================
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.classList.remove('hidden');
  document.getElementById('studentChip').innerHTML = state.student.nama
    ? `<b>${escapeHtml(state.student.nama)}</b><br>NIS ${escapeHtml(state.student.nis)} · Kelas ${escapeHtml(state.student.kelas)}<br>${escapeHtml(state.student.hari)}, ${escapeHtml(state.student.tanggal)}`
    : 'Belum ada data siswa';
  const nav = document.getElementById('steps');
  nav.innerHTML = STEPS.map((s,i)=>{
    const cls = ['step-btn'];
    if(i===state.stepIndex) cls.push('active');
    if(i < state.unlocked) cls.push('done');
    if(i > state.unlocked) cls.push('locked');
    return `<button class="${cls.join(' ')}" onclick="go('${s.id}')" ${i>state.unlocked?'disabled':''}>
      <span class="node">${i<state.unlocked?'✓':s.icon}</span> ${s.label}
    </button>`;
  }).join('<div class="rail"></div>');
}

// ======================= UTIL =======================
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function randArray(n=10, max=99){
  const s = new Set();
  while(s.size<n) s.add(Math.floor(Math.random()*max)+1);
  return Array.from(s);
}

  };

}

// renders a list of MCQ questions into a container, tracking answers in `answerStore` keyed by qKey prefix
function renderMCQBlock(containerId, questions, answerStore, keyPrefix, opts5=true){
  const el = document.getElementById(containerId);
  el.innerHTML = questions.map((item,i)=>{
    const key = keyPrefix+i;
    const chosen = answerStore[key];
    return `<div class="card qcard">
      <div class="qnum">Soal ${i+1}</div>
      <div class="qtext">${escapeHtml(item.q)}</div>
      <div class="opts">
        ${item.opts.map((opt,oi)=>`
          <button class="optbtn ${chosen===oi?'picked':''}" onclick="pickAnswer('${keyPrefix}',${i},${oi})">
            <span class="optletter">${OPT5[oi]}</span><span>${escapeHtml(opt)}</span>
          </button>`).join('')}
      </div>
    </div>`;
  }).join('');
}
function pickAnswer(prefix, i, oi){
  const key = prefix+i;
  if(prefix.startsWith('pre')) state.pretestAnswers[key]=oi;
  else if(prefix.startsWith('quiz')) state.quizAnswers[key]=oi;
  else if(prefix.startsWith('postpgk')) state.postAnswers.pgk[key]=oi;
  else if(prefix.startsWith('postpg')) state.postAnswers.pg[key]=oi;
  renderStage();
}

function genLinearSteps(arr, target){
  const steps=[];
  for(let i=0;i<arr.length;i++){
    steps.push({compare:[i], msg:`Bandingkan indeks ${i} (nilai ${arr[i]}) dengan target ${target}.`});
    if(arr[i]===target){ steps.push({found:[i], msg:`Ditemukan! Target ${target} ada di indeks ${i}.`}); return steps; }
  }
  steps.push({notfound:true, msg:`Target ${target} tidak ditemukan dalam data.`});
  return steps;
}
function genBinarySteps(sortedArr, target){
  const steps=[]; let lo=0, hi=sortedArr.length-1;
  while(lo<=hi){
    const mid=Math.floor((lo+hi)/2);
    steps.push({range:[lo,hi], compare:[mid], msg:`Cek tengah rentang [${lo},${hi}] → indeks ${mid} (nilai ${sortedArr[mid]}).`});
    if(sortedArr[mid]===target){ steps.push({found:[mid], msg:`Ditemukan! Target ${target} ada di indeks ${mid}.`}); return steps; }
    else if(sortedArr[mid]<target){ steps.push({msg:`${sortedArr[mid]} < ${target}, cari di kanan.`}); lo=mid+1; }
    else{ steps.push({msg:`${sortedArr[mid]} > ${target}, cari di kiri.`}); hi=mid-1; }
  }
  steps.push({notfound:true, msg:`Target ${target} tidak ditemukan dalam data.`});
  return steps;
}
function genJumpSteps(sortedArr, target){
  const steps=[]; const n=sortedArr.length; const step=Math.max(1,Math.floor(Math.sqrt(n)));
  let i=0, prev=0;
  while(i<n && sortedArr[Math.min(i,n)-1<0?0:Math.min(i+step,n)-1]<target){
    steps.push({range:[prev, Math.min(i+step,n)-1], msg:`Lompat ke blok berikutnya, cek nilai di indeks ${Math.min(i+step,n)-1} (${sortedArr[Math.min(i+step,n)-1]}).`});
    prev=i; i+=step;
    if(prev>=n){ steps.push({notfound:true, msg:'Target tidak ditemukan (melewati akhir data).'}); return steps; }
  }
  for(let j=prev;j<Math.min(i+step,n);j++){
    steps.push({compare:[j], msg:`Telusuri linier di blok: cek indeks ${j} (nilai ${sortedArr[j]}).`});
    if(sortedArr[j]===target){ steps.push({found:[j], msg:`Ditemukan! Target ${target} ada di indeks ${j}.`}); return steps; }
  }
  steps.push({notfound:true, msg:`Target ${target} tidak ditemukan dalam data.`});
  return steps;
}
function genMergeSteps(arr){
  const steps=[]; const work=arr.slice();
  function mergeSort(a, lo, hi){
    if(hi-lo<=1) return;
    const mid=Math.floor((lo+hi)/2);
    mergeSort(a,lo,mid); mergeSort(a,mid,hi);
    steps.push({range:[lo,hi-1], msg:`Gabungkan bagian [${lo}..${mid-1}] dan [${mid}..${hi-1}].`});
    const merged=[]; let i=lo,j=mid;
    while(i<mid && j<hi){ merged.push(a[i]<=a[j]?a[i++]:a[j++]); }
    while(i<mid) merged.push(a[i++]);
    while(j<hi) merged.push(a[j++]);
    for(let k=0;k<merged.length;k++) a[lo+k]=merged[k];
    steps.push({snapshot:a.slice(), range:[lo,hi-1], msg:`Hasil gabungan sementara untuk rentang [${lo}..${hi-1}].`});
  }
  mergeSort(work,0,work.length);
  steps.push({snapshot:work.slice(), done:true, msg:'Data selesai diurutkan (Merge Sort).'});
  return steps;
}
function genQuickSteps(arr){
  const steps=[]; const work=arr.slice();
  function partition(a, lo, hi){
    const pivot=a[hi];
    steps.push({pivot:[hi], range:[lo,hi], msg:`Pilih pivot = ${pivot} (indeks ${hi}).`});
    let i=lo;
    for(let j=lo;j<hi;j++){
      steps.push({compare:[j], pivot:[hi], msg:`Bandingkan indeks ${j} (${a[j]}) dengan pivot ${pivot}.`});
      if(a[j]<pivot){ [a[i],a[j]]=[a[j],a[i]]; steps.push({snapshot:a.slice(), swap:[i,j], msg:`${a[j]} < pivot, tukar posisi ${i} dan ${j}.`}); i++; }
    }
    [a[i],a[hi]]=[a[hi],a[i]];
    steps.push({snapshot:a.slice(), swap:[i,hi], msg:`Tempatkan pivot ke posisi ${i}.`});
    return i;
  }
  function quickSort(a, lo, hi){
    if(lo<hi){ const p=partition(a,lo,hi); quickSort(a,lo,p-1); quickSort(a,p+1,hi); }
  }
  quickSort(work,0,work.length-1);
  steps.push({snapshot:work.slice(), done:true, msg:'Data selesai diurutkan (Quick Sort).'});
  return steps;
}

};

function changeSimAlgo(v){

function regenerateSimArray(){
  state.simArray = randArray(10,90); state.simSteps=[]; state.simStepIdx=0;
  drawSimBars();
}
function updateScenarioText(){
  const texts = {
    linier:'Bayangkan kamu mencari satu nama di daftar hadir yang belum diurutkan — kamu harus memeriksa nama satu demi satu dari atas.',
    biner:'Bayangkan mencari kata di kamus tebal: kamu langsung membuka bagian tengah, lalu memutuskan mencari ke kiri atau ke kanan.',
    lompat:'Bayangkan mencari halaman di buku tebal dengan cara melompat beberapa halaman dulu, baru menyisir halaman terdekat.',
    merge:'Bayangkan membagi tumpukan kertas ujian ke beberapa teman untuk diurutkan sendiri-sendiri, lalu menggabungkan hasilnya secara berurutan.',
    quick:'Bayangkan mengurutkan sekelompok siswa berdasarkan tinggi badan dengan memilih satu siswa sebagai patokan (pivot), lalu memisahkan yang lebih pendek dan lebih tinggi darinya.',
  };
  document.getElementById('simScenarioText').textContent = texts[state.simAlgo];

function drawSimBars(arrOverride){
  const arr = arrOverride || state.simArray;
  const max = Math.max(...arr, 1);
  const el = document.getElementById('simBars');
  const step = state.simSteps[state.simStepIdx] || {};
  el.innerHTML = arr.map((v,i)=>{
    let cls='bar';
    if(step.compare && step.compare.includes(i)) cls+=' bar-compare';
    if(step.pivot && step.pivot.includes(i)) cls+=' bar-pivot';
    if(step.swap && step.swap.includes(i)) cls+=' bar-swap';
    if(step.found && step.found.includes(i)) cls+=' bar-found';
    if(step.range && (i<step.range[0]||i>step.range[1])) cls+=' bar-dim';
    return `<div class="${cls}" style="height:${20+v/max*140}px;"><span class="bar-val">${v}</span></div>`;
  }).join('');
}
function runSimulation(){
  const cfg = SIM_ALGOS[state.simAlgo];
  let arr = state.simArray.slice();
  if(cfg.type==='search'){
    const target = parseInt(document.getElementById('simTarget').value,10);
    if(isNaN(target)){ document.getElementById('simMsg').textContent='Masukkan angka target terlebih dahulu.'; return; }
    state.simTarget = target;
    let workArr = arr;
    if(cfg.needsSort) workArr = arr.slice().sort((a,b)=>a-b);
    state.simArray = workArr; // reflect sorted order visually if needed
    if(state.simAlgo==='linier') state.simSteps = genLinearSteps(workArr, target);
    else if(state.simAlgo==='biner') state.simSteps = genBinarySteps(workArr, target);
    else state.simSteps = genJumpSteps(workArr, target);
  } else {
    if(state.simAlgo==='merge') state.simSteps = genMergeSteps(arr);
    else state.simSteps = genQuickSteps(arr);
  }
  state.simStepIdx=0;
  document.getElementById('simControls').style.display='flex';
  renderSimFrame();
}
function renderSimFrame(){
  const step = state.simSteps[state.simStepIdx] || {};
  const arr = step.snapshot || state.simArray;
  drawSimBars(arr);
  document.getElementById('simMsg').textContent = step.msg || '';
  document.getElementById('simProgress').textContent = `Langkah ${state.simStepIdx+1} / ${state.simSteps.length}`;
}
function simStep(dir){
  const next = state.simStepIdx+dir;
  if(next<0 || next>=state.simSteps.length) return;
  state.simStepIdx=next;
  renderSimFrame();
}

  const totalMC = POST_PG.length + POST_PGK.length;
  const answeredMC = Object.keys(state.postAnswers.pg).length + Object.keys(state.postAnswers.pgk).length;

  POST_MATCH.left.forEach((l,i)=>{ total++; if(parseInt(state.postAnswers.match[i],10)===i) correct++; });
  POST_ISIAN.forEach((it,i)=>{

    const ans=(state.postAnswers.isian[i]||'').toLowerCase();
    if(it.keys.some(k=>ans.includes(k))) correct++;
  });

  unlockNext();

}

  const post = state.postScore ?? 0;
  const delta = post-pre;
  const quizAvg = Math.round(((state.quizScores.mudah||0)+(state.quizScores.sedang||0)+(state.quizScores.rumit||0))/3);
  stage.innerHTML = `
  <div class="eyebrow-row"><span class="pill">Selesai</span></div>
  <h1 class="page-title">Rekap Hasil Belajar</h1>
  <p class="page-desc">Kerja bagus, ${escapeHtml(state.student.nama)}! Berikut ringkasan perjalanan belajarmu hari ini.</p>
  <div class="result-grid">
    <div class="card result-card"><div class="result-label">Pre-Test</div><div class="result-num">${pre}%</div></div>
    <div class="card result-card"><div class="result-label">Post-Test</div><div class="result-num">${post}%</div></div>
    <div class="card result-card"><div class="result-label">Peningkatan</div><div class="result-num" style="color:${delta>=0?'var(--success)':'var(--danger)'}">${delta>=0?'+':''}${delta}%</div></div>
    <div class="card result-card"><div class="result-label">Rata-rata Kuis</div><div class="result-num">${quizAvg}%</div></div>
  </div>
  <div class="card" style="margin-top:20px;">
    <h3 style="font-size:16px; margin-bottom:12px;">Skor Kuis per Level</h3>
    <div class="quizlevel-bars">
      ${['mudah','sedang','rumit'].map(l=>`
        <div class="qlbar-row">
          <div class="qlbar-label">${l[0].toUpperCase()+l.slice(1)}</div>
          <div class="qlbar-track"><div class="qlbar-fill" style="width:${state.quizScores[l]||0}%"></div></div>
          <div class="qlbar-val mono">${state.quizScores[l]||0}%</div>
        </div>`).join('')}
    </div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3 style="font-size:16px; margin-bottom:8px;">Catatan untuk Guru</h3>
    <p style="color:var(--text-dim); font-size:13.5px; line-height:1.6;">Hasilmu (identitas, skor pre-test, kuis, refleksi, dan post-test) sudah otomatis terkirim dan tercatat untuk gurumu.</p>
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" onclick="restartApp()">Mulai Ulang dari Awal</button>
  </div>`;
}
function restartApp(){
  if(!confirm('Yakin ingin mengulang dari awal? Semua jawaban saat ini akan dihapus dari tampilan (data yang sudah dikumpulkan tetap tersimpan).')) return;
  location.reload();
}

// ======================= KIRIM KE GOOGLE SHEETS =======================
// PENTING: ganti URL di bawah ini dengan URL Web App Google Apps Script kamu
// (lihat panduan setup yang diberikan bersama file ini).
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbw16gCh0ro4qw43kL0JYTBT5gMK0DHjJY3omTukFP2vCsJE4uqPObsi93u64cVKOjkuxw/exec";

function sheetConfigured(){
  return SHEET_WEBAPP_URL && !SHEET_WEBAPP_URL.includes('TEMPEL_URL');
}

// Bangun satu ringkasan lengkap hasil siswa saat ini dari state
function buildStudentRecord(){
  const skalaVals = Object.values(state.reflekSkala);
  const skalaRata = skalaVals.length ? Math.round(skalaVals.reduce((a,b)=>a+b,0)/skalaVals.length*10)/10 : '';
  const reflekTeksGabungan = REFLEKSI_TERBUKA.map(r=>state.reflekTeks[r.id] ? `${r.q} ${state.reflekTeks[r.id]}` : '').filter(Boolean).join(' || ');
  return {
    nama:state.student.nama, nis:state.student.nis, kelas:state.student.kelas,
    hari:state.student.hari, tanggal:state.student.tanggal,
    pretest: state.pretestScore ?? '',
    posttest: state.postScore ?? '',
    kuisMudah: state.quizScores.mudah ?? '',
    kuisSedang: state.quizScores.sedang ?? '',
    kuisRumit: state.quizScores.rumit ?? '',
    reflekSkalaRata: skalaRata,
    reflekTeks: reflekTeksGabungan,
    terakhirDiperbarui: new Date().toISOString(),
  };
}

async function saveResult(){
  if(!sheetConfigured()) return; // belum di-setup, lewati diam-diam
  const record = buildStudentRecord();
  try{
    await fetch(SHEET_WEBAPP_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // hindari CORS preflight
      body: JSON.stringify(record),
    });
  }catch(e){ console.warn('Gagal mengirim ke Google Sheets', e); }
}

// ======================= GURU DASHBOARD =======================
const GURU_ACCESS_CODE = 'GURU2026'; // ganti kode ini sesuai kebutuhan
let guruUnlocked = false;

function openGuruDashboard(){
  if(guruUnlocked){ showGuruStage(); return; }
  const overlay = document.createElement('div');

  overlay.className = 'gate-overlay';
  overlay.id = 'gateOverlay';
  overlay.innerHTML = `
    <div class="gate-card">
      <h3>Dashboard Guru</h3>
      <p>Masukkan kode akses guru untuk melihat rekap hasil seluruh siswa.</p>
      <input type="text" id="gateInput" placeholder="Kode akses" style="width:100%; background:#0D1130; border:1px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--text); font-size:14px; outline:none;">
      <div class="gate-err" id="gateErr"></div>
      <div class="btn-row" style="margin-top:6px;">
        <button class="btn btn-primary" onclick="checkGuruCode()">Masuk</button>
        <button class="btn btn-ghost" onclick="closeGate()">Batal</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('gateInput').focus();
  document.getElementById('gateInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkGuruCode(); });
}
function closeGate(){
  const ov = document.getElementById('gateOverlay');
  if(ov) ov.remove();
}
function checkGuruCode(){
  const val = document.getElementById('gateInput').value.trim();
  if(val === GURU_ACCESS_CODE){
    guruUnlocked = true;
    closeGate();
    showGuruStage();
  } else {
    document.getElementById('gateErr').textContent = 'Kode akses salah. Coba lagi.';
  }
}
function showGuruStage(){
  document.getElementById('sidebar').querySelectorAll('.step-btn').forEach(b=>b.classList.remove('active'));
  renderGuruDashboard();
  window.scrollTo({top:0, behavior:'smooth'});
}
function scoreTag(val){
  if(val===undefined || val===null || val==='') return `<span class="score-tag na">—</span>`;
  const cls = val>=75?'good':val>=50?'mid':'low';
  return `<span class="score-tag ${cls}">${val}%</span>`;
}
let guruRows = [];
async function renderGuruDashboard(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="eyebrow-row"><span class="pill amber">Khusus Guru</span></div>
    <h1 class="page-title">Dashboard Rekap Siswa</h1>
    <p class="page-desc">Rekap otomatis dari Google Sheets — identitas, Pre-Test, Kuis, Refleksi, dan Post-Test semua siswa.</p>
    <div class="guru-toolbar">
      <div style="color:var(--text-dim); font-size:13px;" id="guruSummary">Memuat data...</div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-ghost" onclick="renderGuruDashboard()">↻ Muat Ulang</button>
        <button class="btn btn-ghost" onclick="backFromGuru()">← Kembali</button>
      </div>
    </div>
    <div id="guruContent"><div class="guru-empty">Memuat data siswa…</div></div>`;
  const content = document.getElementById('guruContent');
  const summaryEl = document.getElementById('guruSummary');

  if(!sheetConfigured()){
    content.innerHTML = `<div class="guru-empty">Google Sheets belum terhubung.<br><br>Cari <code>SHEET_WEBAPP_URL</code> di bagian awal kode aplikasi ini, ganti dengan URL Web App Google Apps Script kamu (lihat panduan setup), lalu simpan ulang file ini dan bagikan ke siswa.</div>`;
    summaryEl.textContent = '';
    return;
  }
  try{
    const res = await fetch(SHEET_WEBAPP_URL + '?t=' + Date.now());
    const data = await res.json();
    guruRows = (Array.isArray(data) ? data : []).sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));
    renderGuruTable();
  }catch(e){
    content.innerHTML = `<div class="guru-empty">Gagal memuat data dari Google Sheets. Periksa koneksi internet dan pastikan Web App sudah di-deploy dengan akses "Anyone".</div>`;
    summaryEl.textContent = '';
  }
}
function renderGuruTable(){
  const content = document.getElementById('guruContent');
  const summaryEl = document.getElementById('guruSummary');
  if(guruRows.length===0){
    content.innerHTML = `<div class="guru-empty">Belum ada data siswa yang masuk ke Google Sheets.</div>`;
    summaryEl.textContent = '0 siswa tercatat';
    return;
  }
  summaryEl.textContent = `${guruRows.length} siswa tercatat`;
  content.innerHTML = `<div class="guru-table-wrap"><table class="guru-table">
    <thead><tr>
      <th>Nama</th><th>NIS</th><th>Kelas</th><th>Hari/Tanggal</th>
      <th>Pre-Test</th><th>Post-Test</th><th>Peningkatan</th>
      <th>Kuis Mudah</th><th>Kuis Sedang</th><th>Kuis Rumit</th><th>Refleksi</th>
    </tr></thead>
    <tbody>
      ${guruRows.map((s,i)=>{
        const pre = s.pretest===''?undefined:Number(s.pretest);
        const post = s.posttest===''?undefined:Number(s.posttest);
        const delta = (pre!==undefined && post!==undefined && !isNaN(pre) && !isNaN(post)) ? (post-pre) : null;
        return `<tr>
          <td>${escapeHtml(s.nama||'—')}</td>
          <td class="mono">${escapeHtml(s.nis||'—')}</td>
          <td>${escapeHtml(s.kelas||'—')}</td>
          <td>${escapeHtml(s.hari||'')} ${escapeHtml(s.tanggal||'')}</td>
          <td>${scoreTag(s.pretest)}</td>
          <td>${scoreTag(s.posttest)}</td>
          <td>${delta===null?'—':(delta>=0?'+':'')+delta+'%'}</td>
          <td>${scoreTag(s.kuisMudah)}</td>
          <td>${scoreTag(s.kuisSedang)}</td>
          <td>${scoreTag(s.kuisRumit)}</td>
          <td>${s.reflekTeks ? `<button class="btn btn-ghost" style="padding:6px 10px; font-size:12px;" onclick="showReflekDetail(${i})">Lihat${s.reflekSkalaRata?' ('+s.reflekSkalaRata+'/5)':''}</button>` : '—'}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}
function showReflekDetail(i){
  const s = guruRows[i];
  if(!s) return;
  const overlay = document.createElement('div');
  overlay.className = 'gate-overlay';
  overlay.id = 'reflekOverlay';
  const items = (s.reflekTeks||'').split(' || ').filter(Boolean);
  overlay.innerHTML = `
    <div class="gate-card" style="max-width:520px; max-height:80vh; overflow-y:auto;">
      <h3>Refleksi — ${escapeHtml(s.nama||'')}</h3>
      <p>Rata-rata keyakinan diri: ${s.reflekSkalaRata||'—'} / 5</p>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
        ${items.map(t=>`<div style="background:#0D1130; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:13px; color:var(--text-dim); line-height:1.6;">${escapeHtml(t)}</div>`).join('') || '<div style="color:var(--text-faint); font-size:13px;">Belum ada jawaban terbuka.</div>'}
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-ghost" onclick="document.getElementById('reflekOverlay').remove()">Tutup</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}
function backFromGuru(){
  renderSidebar();
  renderStage();
}

// ======================= INIT =======================
document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});
go('login', {force:true});

</script>
